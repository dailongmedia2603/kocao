name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://admin.kocao.io.vn/api

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend
        run: |
          rsync -avz --delete dist/ root@${{ secrets.VPS_HOST }}:/var/www/kocao/frontend/dist/

      - name: Deploy Backend
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='storage/app' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            backend/ root@${{ secrets.VPS_HOST }}:/var/www/kocao/backend/

      - name: Setup Backend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/kocao/backend
            
            # Create .env if not exists
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            
            # Install dependencies (Host)
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Setup storage permissions (Host)
            chmod -R 775 storage bootstrap/cache
            chown -R www-data:www-data /var/www/kocao
            
            # Run commands inside Docker to ensure correct paths and environment
            docker exec kocao-backend-fpm php artisan migrate --force
            docker exec kocao-backend-fpm php artisan config:cache
            docker exec kocao-backend-fpm php artisan route:cache
            docker exec kocao-backend-fpm php artisan view:cache
            docker exec kocao-backend-fpm php artisan storage:link
            
            # Restart Container
            docker restart kocao-backend-fpm
            
            echo "Deployment completed!"
